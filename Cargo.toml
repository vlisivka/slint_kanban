[package]
name = "slint_kanban"
version = "0.3.0"
edition = "2021"
authors = ["Volodymyr M. Lisivka <vlisivka@gmail.com>"]
description = "A modern, file-system-based Kanban board application built with Rust and Slint UI framework."
license = "GPL-3.0-or-later"
repository = "https://github.com/vlisivka/slint_kanban"
keywords = ["slint", "productivity"]

[dependencies]
slint = { version = "1.17", features = ["gettext"] }
tr = "0.1.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
walkdir = "2"
chrono = "0.4"
anyhow = "1.0"
notify = "8.2.0"
toml = "1.1"
rand = "0.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
trash = "5.2.5"
rfd = "0.17.2"
open = "5.3.3"
arboard = "3.4"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
i-slint-backend-testing = "1.15.1"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.release]
opt-level = "z"
debug = 0
strip = true
panic = "abort"
lto = true
codegen-units = 1
