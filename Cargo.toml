[package]
name = "slint_kanban"
version = "0.2.0"
edition = "2021"

[dependencies]
slint = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
walkdir = "2"
chrono = "0.4"
anyhow = "1.0"
notify = "8.2.0"
rand = "0.8"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
trash = "5.2.5"
rfd = "0.17.2"
open = "5.3.3"
arboard = "3.4"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
i-slint-backend-testing = "1.15.1"
tempfile = "3.10"

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.release]
opt-level = "z"
debug = 0
strip = true
panic = "abort"
lto = true
codegen-units = 1
